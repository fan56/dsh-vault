# CI: build, typecheck, unit suite, and a real-host boot smoke on every push
# to main, every pull request, and a daily schedule.
#
# The dsh CLI version is resolved at runtime from the npm registry's rolling
# rc/stable line — the newest of the `latest` (stable) and `next` (rc)
# dist-tags, never hand-pinned (the rc.8 lesson: a hand-pinned rc went stale
# and rotted the gate) and never the retired alpha line (policy 2026-09-03:
# the alpha line is retired for CI; when a stable 0.1.2+ lands on `latest` it
# wins over the rc by plain semver compare). scripts/link-dsh-closure.mjs
# then re-points node_modules/@deepseek-ai/* at that install's closure, so
# typecheck, tests, and the smoke all run against exactly the code the host
# ships (one @deepseek-ai/cordis in the type graph). The smoke boots a scratch
# profile with the plugin mounted via the real dsh CLI
# (scripts/smoke-boot.mjs) so "loads under real cordis" is a gate, not a
# hope.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 03:23 UTC — catches upstream dsh drift without hand-pinning.
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise (the dsh-tui-pi v1.0.5 lesson).
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (rolling rc/stable line — newest of latest/next, never alpha)
        run: |
          # Policy (2026-09-03): the alpha line is retired for CI. Resolve the
          # newest of the `latest` (stable) and `next` (rc) dist-tags at
          # runtime, never hand-pinned — when a stable 0.1.2+ lands on
          # `latest` it wins over the rc by plain semver compare.
          STABLE="$(npm view @deepseek-ai/dsh@latest version)"
          RC="$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)"
          DSH_VERSION="$STABLE"
          if [ -n "$RC" ] && [ "$(printf '%s\n' "$STABLE" "$RC" | sort -V | tail -1)" = "$RC" ]; then
            DSH_VERSION="$RC"
          fi
          echo "dsh closure: ${DSH_VERSION}"
          npm install -g "@deepseek-ai/dsh@${DSH_VERSION}" --no-audit --no-fund

      # Point node_modules/@deepseek-ai/* at the installed CLI's closure so
      # tsc sees exactly the type graph the host runs (one cordis instance —
      # a second local copy breaks the ctx.settings declare-module merge).
      - name: Link dsh closure types
        run: node scripts/link-dsh-closure.mjs

      # pnpm does not run npm pre/post hooks by default, so build explicitly
      # before test (the test files import lib/).
      - name: Build & Check (tsc)
        run: pnpm build && pnpm check

      - name: Test (unit suite)
        run: pnpm test

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
