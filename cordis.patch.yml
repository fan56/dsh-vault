# dsh-vault bundle patch: mounts the plugin into the profile's assembly tree
# under the stable plugin id `dsh-vault`. The `dsh-vault` entry id doubles as
# the settings namespace (profile-patch config: repo / machineDescription /
# rememberPassphrase) and the `/vault` slash command mounts from the plugin
# itself (backup / restore / config / set).

- insert:
    - id: dsh-vault
      name: '@aiwayds/dsh-vault'
